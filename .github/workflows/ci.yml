name: CI

on:
  push:
    branches: ['main', 'development']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test
      - run: npm run qa:static
      - run: npm run lint
      - run: npm run build
